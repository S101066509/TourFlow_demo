{% extends 'tours_app/base.html' %}
{% load static %}
{% block title %}報名成功 - demo_page{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="mb-4 text-success">
                <i class="bi bi-check-circle-fill" style="font-size: 5rem;"></i>
            </div>
            <h2 class="mb-3">報名成功！感謝您的訂購</h2>
            <p class="text-muted fw-bold">我們已收到您的報名資料，請務必記下您的專屬「訂單編號」，日後可隨時使用此編號查詢您的旅程狀態。</p>
            
            <div class="card shadow-sm mt-4 border-0" style="border-top: 4px solid var(--primary-red) !important;">
                <div class="card-body py-5">
                    <h5 class="text-muted mb-3">您的專屬訂單編號</h5>
                    <div class="d-flex justify-content-center align-items-center gap-2">
                        <span class="fs-1 fw-bold text-dark" id="orderNumber" style="letter-spacing: 2px;">{{ order.order_number }}</span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="copyOrderNumber()" title="複製編號">
                            <i class="bi bi-copy"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-5 d-flex gap-3 justify-content-center">
                <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4 py-2">回首頁</a>
                <a href="{% url 'booking_search' %}" class="btn btn-primary px-4 py-2">立即查詢報名紀錄</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'tours_app/js/booking_success.js' %}"></script>
{% endblock %}
